  <g id="text_15">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d86" x="44.658" y="40.40064" transform="rotate(-0 44.658 40.40064)">PROJECT 01 / EV3 NAVIGATION</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24598a" x="44.658" y="72.38448" transform="rotate(-0 44.658 72.38448)">01 / Top-view layout</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="44.658" y="98.47656" transform="rotate(-0 44.658 98.47656)">Functional layout / not to scale / use official manuals for exact LEGO connections.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #666666" x="44.658" y="812.2212" transform="rotate(-0 44.658 812.2212)">Build companion v2 / 22 Oct 2026 / physical assembly not yet validated</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end" x="550.782" y="812.2212" transform="rotate(-0 550.782 812.2212)">3</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d86" x="44.658" y="542.8836" transform="rotate(-0 44.658 542.8836)">Reference points</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="564.76728" transform="rotate(-0 44.658 564.76728)">O is the midpoint between the drive-wheel contact centers. Define robot pose here; do not</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="579.49668" transform="rotate(-0 44.658 579.49668)">silently use the brick center or front sensor as the position reference. +x is forward; +y</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="594.22608" transform="rotate(-0 44.658 594.22608)">is left; positive heading is counterclockwise when viewed from above.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="614.00556" transform="rotate(-0 44.658 614.00556)">G = gyro on a rigid mount; exact position may differ. C = OPTIONAL downward color sensor,</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="628.73496" transform="rotate(-0 44.658 628.73496)">drawn on the centerline for clarity. If the official module is offset sideways, keep it and</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="643.46436" transform="rotate(-0 44.658 643.46436)">measure that offset. Do not rebuild a sound module just to match this sketch.</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d86" x="44.658" y="671.66064" transform="rotate(-0 44.658 671.66064)">Clearance rule</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="693.54432" transform="rotate(-0 44.658 693.54432)">Measure R from O to the farthest protruding point, including cables. Use a circle of radius</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="708.27372" transform="rotate(-0 44.658 708.27372)">R plus an error allowance for conservative planning and in-place turns. A 0.61 m corridor</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="723.00312" transform="rotate(-0 44.658 723.00312)">admits this envelope only when 2(R + allowance) &lt; 0.61 m. This is a design check, not a</text>
  </g>
  <g id="text_31">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="737.73252" transform="rotate(-0 44.658 737.73252)">measured claim about the base.</text>
  </g>
 </g>
