  <g id="text_14">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d86" x="44.658" y="40.40064" transform="rotate(-0 44.658 40.40064)">PROJECT 01 / EV3 NAVIGATION</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24598a" x="44.658" y="72.38448" transform="rotate(-0 44.658 72.38448)">02 / Side and front views</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="44.658" y="98.47656" transform="rotate(-0 44.658 98.47656)">Sensor orientation and support geometry / conceptual positions / no fixed dimensions.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #666666" x="44.658" y="812.2212" transform="rotate(-0 44.658 812.2212)">Build companion v2 / 22 Oct 2026 / physical assembly not yet validated</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end" x="550.782" y="812.2212" transform="rotate(-0 550.782 812.2212)">4</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d86" x="44.658" y="593.3844" transform="rotate(-0 44.658 593.3844)">Mounting checks</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="615.26808" transform="rotate(-0 44.658 615.26808)">Both driven tires must rest on the floor without chassis twist. The caster must roll freely</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="629.99748" transform="rotate(-0 44.658 629.99748)">and cross tile seams without lifting a driven wheel. Leave clearance so wheels do not rub</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="644.72688" transform="rotate(-0 44.658 644.72688)">axles, beams, cables, or sensor brackets.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="664.50636" transform="rotate(-0 44.658 664.50636)">Orient the gyro to measure yaw (turning about vertical); follow the official module. The</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="679.23576" transform="rotate(-0 44.658 679.23576)">case position in this drawing does not define its internal sensing-axis orientation. A</text>
  </g>
  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="693.96516" transform="rotate(-0 44.658 693.96516)">hand-rotation test must confirm it.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="713.74464" transform="rotate(-0 44.658 713.74464)">Mount the color lens perpendicular and close to the floor without touching it. Try a 5-10</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="728.47404" transform="rotate(-0 44.658 728.47404)">mm lens gap as an experimental starting range, then adjust using real readings and seam</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="44.658" y="743.20344" transform="rotate(-0 44.658 743.20344)">clearance. This range is a tuning suggestion, not a LEGO specification.</text>
  </g>
 </g>
